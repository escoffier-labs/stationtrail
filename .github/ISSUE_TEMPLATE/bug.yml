name: Bug report
description: Something is broken in StationTrail itself, such as a source scanner, doctor, inspect, redaction, or an export command.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did you expect versus what you got?
      placeholder: |
        I ran `stationtrail codex ~/.codex/sessions --dry-run --json` and got X.
        I expected Y.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Which source kind is involved? Pick "n/a" for discover, doctor, or capabilities issues.
      options:
        - codex
        - claude
        - openclaw
        - hermes
        - opencode
        - all
        - n/a
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StationTrail version
      description: Output of `stationtrail version`.
      placeholder: stationtrail 0.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Ubuntu 24.04, macOS 14.5, etc.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Full output
      description: Paste the full stdout + stderr. Prefer a `--dry-run --json` or `doctor --json` summary, which reports structure and counts without printing transcript text.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: scrub
    attributes:
      label: Pre-flight
      options:
        - label: I have scrubbed any personal hostnames, tokens, account names, and unredacted absolute paths from this report.
          required: true
        - label: This report does not paste raw exported transcript text.
          required: true
